  <text x="74" y="505" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#475569">4× Cortex-A53 + 2× A72 (ARMv8.0, без LSE и PAC) · PowerVR GX6250 · 4 ГБ RAM</text>
