<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Consolas,Menlo,monospace">
  <rect width="900" height="400" rx="14" fill="url(#cardbg)"/>

  <rect x="60" y="20" width="780" height="70" rx="8" fill="#f2faf2" stroke="#1fb85c" stroke-width="1.5"/>
  <text x="90" y="48" font-size="16" fill="#1a7a3a" font-weight="bold">Userland Apple (не тронут)</text>
  <text x="90" y="70" font-size="12" fill="#3a6a3a">SpringBoard · WindowServer · всё из iPadOS 16.6.1 — бинарно идентично реальному iPad</text>
  <text x="820" y="48" font-size="11" fill="#2e9e2e" text-anchor="end">подписано Apple</text>

  <path d="M450 90 L450 112" stroke="#2e9e2e" stroke-width="2" marker-end="url(#arrowl)"/>

  <rect x="60" y="112" width="780" height="70" rx="8" fill="#f2faf2" stroke="#1fb85c" stroke-width="1.5"/>
  <text x="90" y="140" font-size="16" fill="#1a7a3a" font-weight="bold">XNU 8796.141.3 (патченное ядро)</text>
  <text x="90" y="162" font-size="12" fill="#3a6a3a">открытый исходник Apple + 86 патчей: GICv2 вместо GICv3, без LSE-атомиков, свои device tree</text>
  <text x="820" y="140" font-size="11" fill="#2e9e2e" text-anchor="end">собрано в CI</text>

  <path d="M450 182 L450 204" stroke="#2e9e2e" stroke-width="2" marker-end="url(#arrowl)"/>

  <rect x="60" y="204" width="780" height="70" rx="8" fill="#f2faf2" stroke="#1fb85c" stroke-width="1.5"/>
  <text x="90" y="232" font-size="16" fill="#1a7a3a" font-weight="bold">M1 Shim (boot-шим)</text>
  <text x="90" y="254" font-size="12" fill="#3a6a3a">голый ARM64-код: таймер, GIC, прерывания — проверено в QEMU, на реальном железе ещё нет</text>
  <text x="820" y="232" font-size="11" fill="#a67a1a" text-anchor="end">PASS в QEMU</text>

  <path d="M450 274 L450 296" stroke="#2e9e2e" stroke-width="2" marker-end="url(#arrowl)"/>

  <rect x="60" y="296" width="780" height="70" rx="8" fill="#fdf3f0" stroke="#d76a4a" stroke-width="1.5"/>
  <text x="90" y="324" font-size="16" fill="#b5502e" font-weight="bold">Xiaomi Mi Pad 3 — MediaTek MT8176</text>
  <text x="90" y="346" font-size="12" fill="#8a5a46">6× Cortex-A53/A72 (ARMv8.0, без LSE/PAC) · GX6250 · 4 ГБ RAM</text>
  <text x="820" y="324" font-size="11" fill="#d76a4a" text-anchor="end">чужое железо</text>

  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ece8ff"/><stop offset="55%" stop-color="#dff1ff"/><stop offset="100%" stop-color="#dcf8ea"/></linearGradient>
    <marker id="arrowl" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e9e2e"/>
    </marker>
  </defs>

  <text x="450" y="390" font-size="11" fill="#5a655a" text-anchor="middle">верхние два слоя — бинарник Apple как есть; нижние два — то, что пишет и патчит этот проект</text>
</svg>
