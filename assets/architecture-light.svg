  <text x="74" y="241" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#475569">Открытый код Apple + 86 патчей: GICv2, без LSE-атомиков, свои драйверы</text>
