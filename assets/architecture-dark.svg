<svg width="900" height="580" viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Consolas,Menlo,monospace">
  <rect width="900" height="580" rx="14" fill="url(#cardbg)"/>

  <!-- Layer 1: userland -->
  <rect x="40" y="20" width="820" height="104" rx="8" fill="#0f2a1a" stroke="#2ee06a" stroke-width="2"/>
  <text x="68" y="54" font-size="22" fill="#4dff88" font-weight="bold">Userland Apple (не тронут)</text>
  <text x="68" y="84" font-size="16" fill="#e4f5e4">SpringBoard · WindowServer · всё из iPadOS 16.6.1</text>
  <text x="68" y="106" font-size="16" fill="#e4f5e4">бинарно идентично реальному iPad</text>
  <text x="832" y="54" font-size="15" fill="#a8e6a8" text-anchor="end">подписано Apple</text>

  <path d="M450 124 L450 148" stroke="#6fd06f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Layer 2: XNU -->
  <rect x="40" y="152" width="820" height="104" rx="8" fill="#0f2a1a" stroke="#2ee06a" stroke-width="2"/>
  <text x="68" y="186" font-size="22" fill="#4dff88" font-weight="bold">XNU 8796.141.3 (патченное ядро)</text>
  <text x="68" y="216" font-size="16" fill="#e4f5e4">открытый исходник Apple + 86 патчей: GICv2 вместо GICv3,</text>
  <text x="68" y="238" font-size="16" fill="#e4f5e4">без LSE-атомиков, свои device tree</text>
  <text x="832" y="186" font-size="15" fill="#a8e6a8" text-anchor="end">собрано в CI</text>

  <path d="M450 256 L450 280" stroke="#6fd06f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Layer 3: shim -->
  <rect x="40" y="284" width="820" height="104" rx="8" fill="#0f2a1a" stroke="#2ee06a" stroke-width="2"/>
  <text x="68" y="318" font-size="22" fill="#4dff88" font-weight="bold">M1 Shim (boot-шим)</text>
  <text x="68" y="348" font-size="16" fill="#e4f5e4">голый ARM64-код: таймер, GIC, прерывания</text>
  <text x="68" y="370" font-size="16" fill="#e4f5e4">проверено в QEMU, на реальном железе ещё нет</text>
  <text x="832" y="318" font-size="15" fill="#ffd15c" text-anchor="end" font-weight="bold">PASS в QEMU</text>

  <path d="M450 388 L450 412" stroke="#6fd06f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Layer 4: hardware -->
  <rect x="40" y="416" width="820" height="104" rx="8" fill="#2a1818" stroke="#ff8a66" stroke-width="2"/>
  <text x="68" y="450" font-size="22" fill="#ffa488" font-weight="bold">Xiaomi Mi Pad 3 — MediaTek MT8176</text>
  <text x="68" y="480" font-size="16" fill="#f5e0d8">6× Cortex-A53/A72 (ARMv8.0, без LSE/PAC)</text>
  <text x="68" y="502" font-size="16" fill="#f5e0d8">GX6250 · 4 ГБ RAM</text>
  <text x="832" y="450" font-size="15" fill="#ff9c7c" text-anchor="end">чужое железо</text>

  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1147"/><stop offset="55%" stop-color="#0f3b66"/><stop offset="100%" stop-color="#0b4f55"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6fd06f"/>
    </marker>
  </defs>

  <text x="450" y="554" font-size="14" fill="#c4cfe0" text-anchor="middle">верхние два слоя — бинарник Apple как есть; нижние два — то, что пишет и патчит этот проект</text>
</svg>
